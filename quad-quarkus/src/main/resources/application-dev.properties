# ── Development Profile ──────────────────────────────────────
# Activation: QUARKUS_PROFILE=dev
# Local development: SQLite, debug logging, full MCP support

# ---- Datasource: SQLite (file-based, shared data/quad.db) ----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:/home/torsten/dev/my-projects/nooa/quad/data/quad.db
quarkus.datasource.jdbc.driver=org.sqlite.JDBC

# ---- Logging: Verbose ----
quarkus.log.level=DEBUG
quarkus.log.category."de.augmentia.quad".level=DEBUG
quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true

# ---- Agent: Full logging ----
quad.agent.logging=true

# ---- MCP: Lokal (stdin/stdout) ----
quad.mcp.enabled=true
quad.mcp.config-path=config/mcp-config.json

# ---- OTel: Disabled (no collector in dev) ----

# ---- Dev-Tools ----
quarkus.dev-mode.enabled=true
