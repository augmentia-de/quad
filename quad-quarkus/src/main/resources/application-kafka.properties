# Kafka Profile - SmallRye Reactive Messaging channel definitions
# Activation: QUARKUS_PROFILE=kafka or -Dquarkus.profile=kafka
#
# Inbound: No longer configured via SmallRye.
# Topics are read dynamically from quad.messaging.kafka.topics
# and a KafkaConsumer subscribes to them directly (see KafkaInboundChannel).

# Outbound (shared)
%kafka.mp.messaging.outgoing.quad-out-kafka.connector=smallrye-kafka
%kafka.mp.messaging.outgoing.quad-out-kafka.topic=${QUAD_MESSAGING_KAFKA_OUTBOUND_TOPIC:quad-results}

# HITL checkpoint notifications
%kafka.mp.messaging.outgoing.quad-hitl-kafka.connector=smallrye-kafka
%kafka.mp.messaging.outgoing.quad-hitl-kafka.topic=${QUAD_MESSAGING_KAFKA_HITL_TOPIC:quad-hitl-checkpoints}
