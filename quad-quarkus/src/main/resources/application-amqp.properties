# AMQP Profile - SmallRye Reactive Messaging channel definitions
# Activation: QUARKUS_PROFILE=amqp or -Dquarkus.profile=amqp
#
# Inbound: No longer configured via SmallRye.
# Queues are read dynamically from quad.messaging.amqp.queues
# (Consumer implementation pending, see AmqpInboundChannel).

# Outbound (shared)
%amqp.mp.messaging.outgoing.quad-out-amqp.connector=smallrye-amqp
%amqp.mp.messaging.outgoing.quad-out-amqp.address=${QUAD_MESSAGING_AMQP_OUTBOUND_QUEUE:quad-results}
