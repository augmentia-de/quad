# ── Cloud Profile (GCP Cloud Run / GKE) ─────────────────────
# Activation: QUARKUS_PROFILE=cloud
# Lightweight: SQLite, no OTel, minimal logging

# ---- Datasource: SQLite (file-based, no server) ----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:./data/quad-cloud.db
quarkus.datasource.jdbc.driver=org.sqlite.JDBC

# ---- Logging: Minimal ----
quarkus.log.level=WARN
quarkus.log.category."de.augmentia.quad".level=INFO
quarkus.log.category."dev.langchain4j".level=WARN
quarkus.log.category."io.quarkiverse.langchain4j".level=WARN
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# ---- Agent ----
quad.agent.logging=false

# ---- OTel: Disabled ----
# No export, no collector, no spans

# ---- MCP: Configurable via env var / config file ----
# In cloud: MCP server as sidecar or externally accessible
# quad.mcp.enabled is controlled via QUAD_MCP_ENABLED env var
# quad.mcp.config-path is set via QUAD_MCP_CONFIG_PATH env var

# ---- OIDC: Disabled by default, like %prod ----
# quarkus.oidc.* properties must always be set (even when disabled),
# because the validation BuildStep loads from the dependency and will crash otherwise.
%cloud.quarkus.oidc.enabled=${OIDC_ENABLED:false}
%cloud.quarkus.oidc.auth-server-url=${OIDC_ISSUER_URL:https://localhost:8443/realms/quarkus}
%cloud.quarkus.oidc.client-id=${OIDC_CLIENT_ID:quad-ui}
%cloud.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}

# ---- Cloud-specific ----
quarkus.http.host=0.0.0.0
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}

# ---- SmallRye Health ----
quarkus.smallrye-health.enabled=true
