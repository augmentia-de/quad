# ── Production profile (Docker / VM) ─────────────────────────
# Activation: QUARKUS_PROFILE=prod
# PostgreSQL, OTel → Langfuse/Tempo, reduced logging

# ---- Logging: Strukturiert ----
quarkus.log.level=INFO
quarkus.log.category."de.augmentia.quad".level=INFO
quarkus.log.category."dev.langchain4j".level=WARN
quarkus.log.category."io.quarkiverse.langchain4j".level=WARN
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true

# ---- Agent: no verbose logging ----
quad.agent.logging=false

# ---- MCP: enabled (via docker mount) ----
quad.mcp.enabled=true
quad.mcp.config-path=${QUAD_MCP_CONFIG_PATH:/workspace/mcp-config.json}

# ---- OTel: Aktiviert (OTLP → OTel Collector) ----
#quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
#quarkus.otel.exporter.otlp.traces.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4317}
#quarkus.otel.exporter.otlp.traces.headers=${QUARKUS_OTEL_EXPORTER_OTLP_TRACES_HEADERS:}

# ---- SmallRye Health (Liveness/Readiness) ----
quarkus.smallrye-health.enabled=true
