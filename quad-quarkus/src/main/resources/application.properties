# ============================================================
# quad Security Architecture (Phase 5)
# ============================================================
# The web auth part (OIDC) is configured via quarkus.oidc.*. The domain-specific
# layer switches are read by the core code exclusively via System-Properties or
# env vars (QUAD_SECURITY_*, see SecurityConfig / TokenExchangeConfig),
# NOT from this file — values here would have no effect. The layers are therefore
# deliberately disabled here and only documented as a reference of the expected env keys.
# Exceptions (read directly from this file):
#   - quad.security.oidc.enabled     (SecurityEnforcementFilter, false = filter off)
#   - quad.security.audit.enabled    (QuarkusAuditLogger, default true)
#   - quad.security.audit.path       (QuarkusAuditLogger, default logs/audit.jsonl)
# All layers are disabled by default (false).
# ============================================================

# ---- Layer 1: OAuth 2.1 + PKCE (UI ↔ Backend) ----
# Disabled by default — enable with OIDC_ENABLED=true and set the env vars
# quarkus.oidc.* properties must always be set (even when disabled),
# because the validation BuildStep loads from the dependency and will crash otherwise.
%dev.quarkus.oidc.enabled=true
%dev.quarkus.oidc.auth-server-url=${OIDC_ISSUER_URL:http://localhost:8180/realms/quarkus}
%dev.quarkus.oidc.client-id=${OIDC_CLIENT_ID:quad-ui}
%dev.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}

%prod.quarkus.oidc.enabled=${OIDC_ENABLED:false}
%prod.quarkus.oidc.auth-server-url=${OIDC_ISSUER_URL:https://localhost:8443/realms/quarkus}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:quad-ui}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}

quad.security.oidc.enabled=false

# Additional quad.security.oidc.* switches only effective via env/system properties.
# Reference (disabled here): auth-server-url, client-id=quad-ui, credentials.secret,
# token.audience=quad-api, token.issuer, token.lifetime-seconds=900,
# roles.enabled=false, roles.claim=groups, roles.mapping.admin/operator/viewer.

# ---- Layer 2: User Identity Propagation ----
# Implemented, but only effective via env/system properties (QUAD_SECURITY_IDENTITY_*).
# Reference (disabled here): enabled=false, propagate-to-tools=true,
# propagate-to-mcp=true, required=false.

# ---- Layer 3: Token Exchange (RFC 8693) — Backend → MCP ----
# Implemented (TokenExchangeConfig), but only effective via env/system properties
# (QUAD_SECURITY_TOKEN_EXCHANGE_*). Reference (disabled here):
#   enabled=false; issuer=${quad.security.oidc.auth-server-url:}
#   client-id=quad-backend; credentials.secret; default-audience=mcp-server
#   default-scopes=openid,profile; token-lifetime-seconds=300
#   subject-token-type=urn:ietf:params:oauth:token-type:access_token
#   requested-token-type=urn:ietf:params:oauth:token-type:access_token

# ---- Layer 4: Tool RBAC ----
# Implemented, but only effective via env/system properties (QUAD_SECURITY_TOOLS_*).
# Reference (disabled here): tools.enabled=false, tools.default-deny=false,
# tools.allowed-roles=<csv> and tools.allowed-mcp-roles=<csv> (format see
# SecurityConfig). The former per-tool suffix keys (allowed-roles.executeBash=…)
# did not match the parsed format and were removed.

# ---- Layer 5: Audit Trail ----
quad.security.audit.enabled=true
quad.security.audit.path=${QUAD_AUDIT_PATH:logs/audit.jsonl}
# DBAuditLogger: optional "db"/"both" mode instead of file — quad.security.audit.mode
# (default "file", file-only). Additional switches only via env/system properties:
# QUAD_SECURITY_AUDIT_LOG_IDENTITY=true, _LOG_ARGUMENTS=true, _LOG_RESULT=false,
# _CORRELATION_HEADER=X-Correlation-ID. token-id-log / token-raw-log: not implemented.
