quarkus.http.port=${QUARKUS_HTTP_PORT:8086}

# ---- Datasource (cross-profile) ----
# Dev/Cloud: SQLite (file-based) | Prod: PostgreSQL via Env vars
quarkus.datasource.db-kind=${QUARKUS_DATASOURCE_DB_KIND:sqlite}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:sqlite:/home/torsten/dev/my-projects/nooa/quad/data/quad.db}
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}
quarkus.datasource.jdbc.min-size=${QUARKUS_DATASOURCE_MIN_SIZE:5}
quarkus.datasource.jdbc.max-size=${QUARKUS_DATASOURCE_MAX_SIZE:20}
quarkus.datasource.jdbc.acquisition-timeout=${QUARKUS_DATASOURCE_ACQUISITION_TIMEOUT:15}

# Flyway: automatic migration on startup
# Dialect-dependent migrations: shared SQL in common/, SQLite/H2/PG overrides in the respective subdirectory.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.repair-at-start=true
quarkus.flyway.out-of-order=true
quarkus.flyway.locations=db/migration/common,db/migration/${quarkus.datasource.db-kind}

# ---- HITL (Human-in-the-Loop) ----
quad.hitl.approval-tools=
quad.hitl.notification.emails=
quad.hitl.timeout-seconds=120
# Notification channels (comma-separated): sse (UI popup), email, kafka.
# When the UI/SSE stream is connected only the popup is delivered; otherwise the
# async channels are used as fallback. Kafka additionally requires
# quad.hitl.kafka.enabled=true (see application-kafka.properties for the topic).
quad.hitl.notification.channels=sse,email
quad.hitl.kafka.enabled=${QUAD_HITL_KAFKA_ENABLED:false}
quad.hitl.enabled=${QUAD_HITL_ENABLED:true}

# ---- Permission (command layer, port 02) ----
quad.permission.enabled=${QUAD_PERMISSION_ENABLED:false}
# Missing permission → HITL checkpoint (instead of a hard block): APPROVED = tool runs
# anyway, REJECTED/Timeout = cancel. Only effective when HITL is active.
quad.permission.hitl-escalation=${QUAD_PERMISSION_HITL_ESCALATION:false}

