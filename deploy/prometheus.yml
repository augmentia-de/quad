# Prometheus Configuration — Metriken-Scraping
# Scrape OTel Collector (Prometheus-Endpoint) + quad Apps

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── OTel Collector (Prometheus-Exporter auf :8889) ─────────
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          app: "otel-collector"

  # ── Tempo Metriken ─────────────────────────────────────────
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          app: "tempo"

  # ── Prometheus Self-Monitoring ─────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  # ── quad Quarkus (falls SmallRye Metrics aktiv) ────────────
  - job_name: "quad-quarkus"
    dns_sd_configs:
      - names: ["quarkus-backend"]
        type: A
        port: 8086
    metrics_path: "/q/metrics"
    scrape_interval: 10s
