# nginx-vm.conf — Nginx für GCE e2-micro VM (nativ ohne Docker)
# Verwendet durch scripts/deploy-gce.sh. Kopiert nach /etc/nginx/sites-available/quad
#
# Liefert das React-Frontend (dist/) und proxyt /api/ an das native
# QUAD-Quarkus-Binary (Port 8080, systemd-Unit quad-backend).

server {
    listen 80;
    server_name _;

    root /opt/quad/frontend;
    index index.html;

    # SSE (Server-Sent Events) für HITL-Checkpoints: kein Buffering/Caching
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Quarkus Health/Dev-Endpoints (SmallRye Health auf /q/health),
    # extern erreichbar (z.B. Uptime-Checks), nicht nur /api/
    location /q/ {
        proxy_pass http://127.0.0.1:8080/q/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}