# OTel Collector Configuration — Receivers + Exporters
# Receives OTel spans/metrics from Quarkus
# Exports to Tempo (traces), Prometheus (metrics)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # ── Tempo (Traces) ─────────────────────────────────────────
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # ── Prometheus (Metriken) ──────────────────────────────────
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: quad

  # ── Logging (Debug) ────────────────────────────────────────
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
