# ── Cloud Profile (GCP Cloud Run / GKE) ─────────────────────
# Leichtgewichtig: SQLite, kein OTel, minimales Logging

# ---- Quarkus ----
quarkus:
  env:
    QUARKUS_PROFILE: cloud
    QUARKUS_HTTP_PORT: "8080"
    # SQLite: db-kind + URL werden via application-cloud.properties gesetzt

# ---- Ingress (GCE Controller) ----
ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: quad-static-ip
    networking.gke.io/managed-certificates: quad-cert
  host: quad.example.com
  tls:
    - secretName: quad-tls
      hosts:
        - quad.example.com

# ---- MCP (konfigurierbar) ----
mcp:
  enabled: false
  image:
    repository: gcr.io/PROJECT_ID/quad-mcp
    tag: latest

# ---- Keine externe DB (SQLite) ----
postgresql:
  enabled: false
  cloudSqlProxy:
    enabled: false

# ---- HPA ----
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5

# ---- Secrets (GCP Secret Manager) ----
secrets:
  provider: gcp-secret-manager
  create: false
  data:
    OPENAI_API_KEY: projects/PROJECT_ID/secrets/openai-api-key/versions/latest
