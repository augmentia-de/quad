{{- if .Values.quarkus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quad.fullname" . }}-quarkus
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "quad.labels" . | nindent 4 }}
    app.kubernetes.io/component: quarkus
spec:
  type: {{ .Values.quarkus.service.type }}
  ports:
    - port: {{ .Values.quarkus.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "quad.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: quarkus
{{- end }}
