# 02-observability.yml — OpenTelemetry, Tracing, Metriken & Langfuse
# Starten: ./stack.sh obs

networks:
  llm-net:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  langfuse_postgres_data:
  tempo_data:

services:
  # ── OTel Collector ─────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - llm-net

  # ── Prometheus (Metriken) ──────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - llm-net

  # ── Tempo (Distributed Tracing) ───────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
    networks:
      - llm-net

  # ── Grafana (Dashboards) ──────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    ports:
      - "3001:3000"   # Host 3001 → Container 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - llm-net

  # ── Langfuse DB ───────────────────────────────────────────
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse-db
    environment:
      POSTGRES_USER: ${LANGFUSE_PG_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD:-langfuse}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - llm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_PG_USER:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Langfuse (LLM Observability UI) ───────────────────────
  langfuse-web:
    image: langfuse/langfuse:2
    container_name: langfuse-web
    ports:
      - "5001:3000"   # Host 5001 → Container 3000
    environment:
      - DATABASE_URL=postgresql://${LANGFUSE_PG_USER:-langfuse}:${LANGFUSE_PG_PASSWORD:-langfuse}@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-nextauth}
      - SALT=${LANGFUSE_SALT:-change-me-salt}
      - NEXTAUTH_URL=http://localhost:5001
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:-change-me-encryption-key}
      - AUTH_DISABLE_PASSWORD_LOGIN=false
      - TELEMETRY_ENABLED=false
    depends_on:
      langfuse-db:
        condition: service_healthy
    networks:
      - llm-net
